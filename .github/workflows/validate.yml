name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate experiment schema and state gates
        run: python tools/validate_experiments.py --root .
      - name: Check README is regenerated from frontmatter
        run: python tools/generate_readme.py --root . --check
